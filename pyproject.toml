[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "virtualtissue-xenium"
version = "2.0.0a1"
description = "Context-conditioned virtual tissue research simulations from annotated Xenium and single-cell objects, with auditable guidebooks and Jev decisions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helder Nakaya" }]
requires-python = ">=3.12,<3.14"
keywords = ["spatial transcriptomics", "Xenium", "agent-based model", "virtual tissue", "AUCell", "LLM agents", "Jev"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
# The v2 JSON/context/simulation core uses the standard library only.
dependencies = []

[project.optional-dependencies]
xenium = ["numpy>=1.26,<3", "pandas>=2.2,<3", "h5py>=3.11,<4", "pyarrow>=17,<24", "anndata>=0.11,<0.13", "scipy>=1.13,<2"]
# Byte-for-byte legacy environment; also embedded in original prepared bundles.
legacy = [
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "h5py==3.16.0",
    "pyarrow==19.0.1",
    "shapely==2.2.0",
    "matplotlib==3.11.2",
    "anndata==0.12.19",
    "scverse-misc==0.1.7",
    "typing_extensions==4.16.0",
    "zarr==2.18.7",
    "numcodecs==0.15.1",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "decoupler==2.3.0",
    "adjusttext==1.3.0",
    "marsilea==0.5.6",
    "legendkit==0.3.6",
    "docrep==0.3.2",
    "session-info2==0.2.3",
    "ipywidgets==8.1.7",
    "nbformat==5.10.4",
]
notebooks = ["jupyterlab", "ipykernel"]
test = ["pytest>=8"]

[project.scripts]
vtx = "virtualtissue_xenium.cli:main"
vtx2 = "virtualtissue_xenium.v2.cli:main"

[project.urls]
Homepage = "https://github.com/hylixinsights/VirtualTissue-Xenium"
Documentation = "https://github.com/hylixinsights/VirtualTissue-Xenium/tree/main/docs"
Issues = "https://github.com/hylixinsights/VirtualTissue-Xenium/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualtissue_xenium"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "notebooks", "tools", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "requirements.txt", "pyproject.toml", "examples", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
