[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "virtualtissue-xenium"
version = "0.1.3.dev0"
description = "AI-agent-driven virtual tissue simulations built from 10x Genomics Xenium data (segmentation, XY coordinates and gene expression), with each cell deciding through the Jev (TypeSafe) Choice API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helder Nakaya" }]
requires-python = ">=3.12,<3.14"
keywords = ["spatial transcriptomics", "Xenium", "agent-based model", "virtual tissue", "AUCell", "LLM agents", "Jev"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
# Exact pins: this is the environment in which the engine was validated
# (identical to src/virtualtissue_xenium/engine/requirements-colab.txt, which the
# Colab notebooks install and which is copied into every prepared bundle).
# tests/test_engine_integrity.py checks that the two lists stay identical.
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "h5py==3.16.0",
    "pyarrow==19.0.1",
    "shapely==2.2.0",
    "matplotlib==3.11.2",
    "anndata==0.12.19",
    "scverse-misc==0.1.7",
    "typing_extensions==4.16.0",
    "zarr==2.18.7",
    "numcodecs==0.15.1",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "decoupler==2.3.0",
    "adjusttext==1.3.0",
    "marsilea==0.5.6",
    "legendkit==0.3.6",
    "docrep==0.3.2",
    "session-info2==0.2.3",
    "ipywidgets==8.1.7",
    "nbformat==5.10.4",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel"]
test = ["pytest>=8"]

[project.scripts]
vtx = "virtualtissue_xenium.cli:main"

[project.urls]
Homepage = "https://github.com/hylixinsights/VirtualTissue-Xenium"
Documentation = "https://github.com/hylixinsights/VirtualTissue-Xenium/tree/main/docs"
Issues = "https://github.com/hylixinsights/VirtualTissue-Xenium/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualtissue_xenium"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "notebooks", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "requirements.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
