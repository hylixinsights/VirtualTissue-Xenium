name: Tests
on:
  push:
  pull_request:
jobs:
  v2-v3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install -e '.[xenium,test,spatial,analysis]' pytest-cov
      - run: python -m pytest tests/test_v2_*.py tests/test_v3_*.py tests/test_mac_workflow.py tests/test_release_gate_integrity.py tests/test_acceptance_launcher.py -q --cov=virtualtissue_xenium.v2 --cov=virtualtissue_xenium.v3 --cov-report=xml --junitxml=test-results.xml
      - run: python tools/run_acceptance.py --check-junit test-results.xml --allow-no-skips
      - run: python -m compileall -q src/virtualtissue_xenium/v2 src/virtualtissue_xenium/v3
      - run: python tools/validate_clock_v3.py --output outputs/clock-validation
      - uses: actions/upload-artifact@v4
        with:
          name: v3-validation-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
            outputs/clock-validation/
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install -e '.[legacy,test]'
      - run: python -m pytest tests -q
      - run: node tests/test_player_logic.cjs
  mac-acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the fresh-clone entry point
        run: zsh START_TEST.command --no-open --output-root "$RUNNER_TEMP/vtx-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-acceptance
          path: |
            ${{ runner.temp }}/vtx-acceptance/RESULT.*
            ${{ runner.temp }}/vtx-acceptance/results/*/validation.json
            ${{ runner.temp }}/vtx-acceptance/results/*/tests.xml
            ${{ runner.temp }}/vtx-acceptance/results/*/logs/
