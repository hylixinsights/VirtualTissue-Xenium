name: Tests
on:
  push:
  pull_request:
jobs:
  v2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[xenium,test]'
      - run: python -m pytest tests/test_v2_*.py -q
      - run: python -m compileall -q src/virtualtissue_xenium/v2
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[legacy,test]'
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_player_logic.cjs
